services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plan}
      POSTGRES_USER: ${POSTGRES_USER:-plan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set password}
      TZ: Asia/Seoul
    ports: ['127.0.0.1:15407:5432']
    volumes:
      - plan-routine-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during its first run the image's temporary server answers only on the socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
  api:
    # Tagged by commit on the server, so a rollback starts the earlier image (deploy/remote-deploy.sh).
    image: plan-backend:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: backend/Dockerfile, secrets: [npm_token] }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-plan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-plan}
      PORT: 3107
      # #156: listen on every interface inside the container; a run outside it defaults to 127.0.0.1.
      HOST: 0.0.0.0
      TZ: Asia/Seoul
      # #126: the shared sign-in (sirloinbh/shared-auth) checks each /api session on its network.
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL:-http://shared-auth-api:3110}
      # shared-ai's public key; /internal/tools is served only when it is set (project-standards docs/ai-tools.md).
      AI_TOOLS_PUBLIC_KEY: ${AI_TOOLS_PUBLIC_KEY:-}
      # Web Push reminders (#249): empty keys leave the sender off. The server deploy reads them from SSM.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    networks:
      default: {}
      shared-auth: {}
      # shared-ai reads this app's tools at http://plan-routine-api:3107/internal/tools (ADR-0017).
      shared-ai: { aliases: [plan-routine-api] }
    depends_on:
      db: { condition: service_healthy }
    # The image has no curl, so node asks the API itself. `docker compose up -d --wait` and web depends_on use it (#894).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3107/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
  web:
    image: plan-frontend:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: frontend/Dockerfile, secrets: [npm_token] }
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8107}:80']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  plan-routine-data:
# Created by the shared-auth compose project. Locally, run shared-auth first, or once: docker network create shared-auth
networks:
  shared-auth:
    external: true
  # Created by deploy/remote-deploy.sh or the shared-ai deploy when missing. Locally, once: docker network create shared-ai
  shared-ai:
    name: shared-ai
    external: true
# The Dockerfiles read the GitHub Packages token as a BuildKit secret, so it never lands in an image layer.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
